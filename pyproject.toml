[project]
name = "policyscan"
version = "0.1.0"
description = "Compares what a website's privacy policy says with what the site does, and scores it 1-10."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml_html_clean>=0.4",
    "beautifulsoup4>=4.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
]
transformers = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "shap>=0.46",
]
audit = [
    "playwright>=1.46",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration tests that hit the real network (deselect with -m 'not live')",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E731"]  # B008: FastAPI Depends() defaults; E501: long regex lines
